<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bank Finder - 銀行・支店コード検索</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f172a;       /* メイン濃紺 */
      --accent: #2563eb;        /* アクセントブルー */
      --accent-gradient: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      --bg-color: #f1f5f9;      /* 全体背景色 */
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --focus-ring: rgba(59, 130, 246, 0.25);
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
      margin: 0; padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex; flex-direction: column; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. 高品位グラデーションヘッダー */
    .header {
      background: var(--accent-gradient);
      color: #ffffff;
      padding: 24px 20px 30px;
      text-align: center;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.25);
    }

    .header-logo {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 6px;
    }

    .logo-icon {
      width: 28px; height: 28px; fill: #ffffff;
    }

    .header-title {
      font-size: 22px; font-weight: 700; margin: 0;
      letter-spacing: 0.5px;
    }

    .header-sub {
      font-size: 12px; color: rgba(255, 255, 255, 0.8);
      margin-top: 4px; font-weight: 400;
    }

    /* メインコンテンツエリア */
    .container {
      flex: 1;
      padding: 0 16px 30px;
      max-width: 460px; width: 100%;
      margin: -20px auto 0;
    }

    /* カードデザイン */
    .card {
      background: var(--card-bg);
      padding: 24px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.8);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px; position: relative;
    }

    label {
      display: flex; align-items: center; gap: 6px;
      font-weight: 700; margin-bottom: 8px;
      color: var(--text-main); font-size: 14px;
    }

    label svg {
      width: 16px; height: 16px; fill: var(--accent);
    }

    /* 入力フォーム */
    input {
      width: 100%; padding: 14px 16px;
      font-size: 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      background-color: #f8fafc;
      color: var(--text-main);
      transition: all 0.2s ease;
      -webkit-appearance: none;
    }

    input:focus {
      border-color: #3b82f6;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px var(--focus-ring);
      outline: none;
    }

    input:disabled {
      background-color: #f1f5f9;
      color: #94a3b8;
      border-color: #e2e8f0;
      cursor: not-allowed;
    }

    /* タッチ操作しやすいカスタムドロップダウン */
    .custom-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-height: 240px; overflow-y: auto; z-index: 1000;
      box-shadow: 0 12px 28px -4px rgba(15, 23, 42, 0.15);
      display: none;
    }

    .custom-item {
      padding: 14px 16px; cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 15px; font-weight: 500;
      transition: background 0.15s ease;
    }

    .custom-item:last-child { border-bottom: none; }
    .custom-item:active, .custom-item:hover {
      background-color: #eff6ff; color: var(--accent);
    }

    .custom-item .code {
      color: var(--accent);
      font-weight: 700; font-size: 13px;
      background: #dbeafe; padding: 2px 8px; border-radius: 6px;
    }

    /* 結果カード */
    .result-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      display: none;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 2px solid #3b82f6;
    }

    .result-header {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      color: var(--accent); font-weight: 700; font-size: 16px;
      padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; margin-bottom: 16px;
    }

    .result-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }

    .result-item {
      background: #f8fafc; padding: 12px;
      border-radius: 10px; border: 1px solid #f1f5f9; text-align: center;
      transition: all 0.2s ease;
      position: relative;
    }

    /* タップ可能なコピー対象カード */
    .result-item.copyable {
      cursor: pointer;
      border: 1px solid #dbeafe;
      background: #f0f7ff;
    }

    .result-item.copyable:active {
      transform: scale(0.97);
      background-color: #dbeafe;
    }

    .result-item span {
      display: block; font-size: 11px; color: var(--text-sub);
      margin-bottom: 4px; font-weight: 500;
    }

    .result-item strong {
      font-size: 15px; color: var(--text-main); font-weight: 700; word-break: break-all;
    }

    .copy-badge {
      display: inline-block;
      font-size: 10px;
      color: var(--accent);
      margin-top: 4px;
      font-weight: 600;
    }

    .error-msg {
      color: #ef4444; font-size: 12px; margin-top: 6px; display: none; font-weight: 500;
    }

    /* コピー成功時のトースト通知 */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 2000;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* フッター */
    .footer {
      background-color: var(--primary);
      color: #94a3b8;
      text-align: center;
      padding: 20px;
      font-size: 12px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- 上部ヘッダー -->
  <header class="header">
    <div class="header-logo">
      <svg class="logo-icon" viewBox="0 0 24 24">
        <path d="M11.5 1L2 6v2h19V6l-9.5-5zm-7 8v9h3V9h-3zm5 0v9h3V9h-3zm5 0v9h3V9h-3zm5 0v9h3V9h-3zM2 20v2h19v-2H2z"/>
      </svg>
      <h1 class="header-title">Bank Code Finder</h1>
    </div>
    <div class="header-sub">金融機関・支店コード即時検索サービス</div>
  </header>

  <div class="container">
    <div class="card">
      <!-- 1. 銀行選択 -->
      <div class="form-group">
        <label for="bank-input">
          <svg viewBox="0 0 24 24"><path d="M4 10v7h3v-7H4zm6 0v7h3v-7h-3zm6 0v7h3v-7h-3zM2 22h19v-3H2v3zm10-19L2 7h19L12 3z"/></svg>
          銀行名・金融機関コード
        </label>
        <input type="text" id="bank-input" placeholder="銀行名・読み・コードを入力" autocomplete="off">
        <div id="bank-list" class="custom-list"></div>
        <div id="bank-error" class="error-msg">※候補の中から正しい銀行を選択してください</div>
      </div>

      <!-- 2. 支店選択 -->
      <div class="form-group">
        <label for="branch-input">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          支店名・支店コード
        </label>
        <input type="text" id="branch-input" placeholder="まず銀行を選択してください" autocomplete="off" disabled>
        <div id="branch-list" class="custom-list"></div>
        <div id="branch-error" class="error-msg">※候補の中から正しい支店を選択してください</div>
      </div>
    </div>

    <!-- 3. 検索結果表示 -->
    <div id="result" class="result-card">
      <div class="result-header">
        <svg style="width:20px;height:20px;fill:#2563eb;" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        検索結果
      </div>
      <div class="result-grid">
        <div class="result-item copyable" onclick="copyToClipboard('res-bank-code', '銀行コード')">
          <span>銀行コード (タップでコピー)</span>
          <strong id="res-bank-code">-</strong>
          <span class="copy-badge">📋 タップ</span>
        </div>
        <div class="result-item">
          <span>銀行名</span>
          <strong id="res-bank-name">-</strong>
        </div>
        <div class="result-item copyable" onclick="copyToClipboard('res-branch-code', '支店コード')">
          <span>支店コード (タップでコピー)</span>
          <strong id="res-branch-code">-</strong>
          <span class="copy-badge">📋 タップ</span>
        </div>
        <div class="result-item">
          <span>支店名</span>
          <strong id="res-branch-name">-</strong>
        </div>
      </div>
    </div>
  </div>

  <!-- トースト通知用メッセージ -->
  <div id="toast" class="toast">コピーしました！</div>

  <footer class="footer">
    <p style="margin:0;">&copy; Bank Code Finder. All Rights Reserved.</p>
  </footer>

  <script>
    let rawBankList = [];     
    let rawBranchList = [];   
    let selectedBank = null;
    let selectedBranch = null;

    function kataToHira(str) { return (str || '').replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60)); }
    function hiraToKata(str) { return (str || '').replace(/[\u3041-\u3096]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x60)); }
    function normalizeStr(str) { return (str || '').normalize('NFKC').toLowerCase(); }

    // クリップボードコピー処理
    function copyToClipboard(elementId, labelText) {
      const text = document.getElementById(elementId).textContent;
      if (!text || text === '-') return;

      navigator.clipboard.writeText(text).then(() => {
        showToast(`${labelText} (${text}) をコピーしました！`);
      }).catch(err => {
        console.error('コピー失敗:', err);
      });
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const bankInput = document.getElementById('bank-input');
      const bankList = document.getElementById('bank-list');
      const bankError = document.getElementById('bank-error');
      const branchInput = document.getElementById('branch-input');
      const branchList = document.getElementById('branch-list');
      const branchError = document.getElementById('branch-error');

      fetch('./bank.json')
        .then(res => res.json())
        .then(data => {
          rawBankList = Object.keys(data).map(code => {
            const b = data[code];
            const name = b.name || b;
            const kana = b.kana || b.hiragana || '';
            return {
              code, name, kana,
              normName: normalizeStr(name),
              normKana: normalizeStr(kana),
              normHira: kataToHira(normalizeStr(kana || name)),
              normKata: hiraToKata(normalizeStr(kana || name))
            };
          });
        })
        .catch(err => console.error('bank.json 読み込み失敗:', err));

      bankInput.addEventListener('input', () => {
        const val = bankInput.value.trim();
        bankError.style.display = 'none';
        resetBranch();
        if (!val) { bankList.style.display = 'none'; return; }

        const normK = normalizeStr(val);
        const kHira = kataToHira(normK);
        const kKata = hiraToKata(normK);

        const filtered = rawBankList.filter(b => {
          return b.normName.includes(normK) ||
                 b.code.startsWith(normK) ||
                 (b.normKana && b.normKana.includes(kKata)) ||
                 b.normHira.includes(kHira) ||
                 b.normKata.includes(kKata);
        });

        renderCustomList(bankList, filtered, (item) => {
          selectedBank = item;
          bankInput.value = item.name;
          bankList.style.display = 'none';
          bankError.style.display = 'none';
          loadBranches(item.code);
        });
      });

      function loadBranches(bankCode) {
        branchInput.disabled = true;
        branchInput.placeholder = '支店データを読み込み中...';
        branchList.innerHTML = '';
        rawBranchList = [];

        fetch(`./branches/${bankCode}.json`)
          .then(res => {
            if (!res.ok) throw new Error('支店ファイルなし');
            return res.json();
          })
          .then(branches => {
            const parseBranch = (code, name, kana) => {
              const k = kana || '';
              return {
                code, name, kana: k,
                normName: normalizeStr(name),
                normKana: normalizeStr(k),
                normHira: kataToHira(normalizeStr(k || name)),
                normKata: hiraToKata(normalizeStr(k || name))
              };
            };

            if (Array.isArray(branches)) {
              rawBranchList = branches.map(b => parseBranch(b.code, b.name, b.kana || b.hiragana));
            } else {
              rawBranchList = Object.keys(branches).map(code => {
                const b = branches[code];
                return parseBranch(code, b.name || b, b.kana || b.hiragana);
              });
            }

            branchInput.disabled = false;
            branchInput.placeholder = '支店名・読み・コードを入力';
            branchInput.focus();
          })
          .catch(err => {
            console.error(err);
            branchInput.placeholder = '支店データの読み込みに失敗しました';
          });
      }

      branchInput.addEventListener('input', () => {
        const val = branchInput.value.trim();
        branchError.style.display = 'none';
        hideResult();
        if (!val) { branchList.style.display = 'none'; return; }

        const normK = normalizeStr(val);
        const kHira = kataToHira(normK);
        const kKata = hiraToKata(normK);

        const filtered = rawBranchList.filter(b => {
          return b.normName.includes(normK) ||
                 b.code.startsWith(normK) ||
                 (b.normKana && b.normKana.includes(kKata)) ||
                 b.normHira.includes(kHira) ||
                 b.normKata.includes(kKata);
        });

        renderCustomList(branchList, filtered, (item) => {
          selectedBranch = item;
          branchInput.value = item.name;
          branchList.style.display = 'none';
          branchError.style.display = 'none';
          showResult();
        });
      });

      function renderCustomList(listEl, items, onSelect) {
        listEl.innerHTML = '';
        if (items.length === 0) { listEl.style.display = 'none'; return; }

        items.slice(0, 30).forEach(item => {
          const div = document.createElement('div');
          div.className = 'custom-item';
          div.innerHTML = `<span>${item.name}</span> <span class="code">${item.code}</span>`;
          div.addEventListener('click', () => onSelect(item));
          listEl.appendChild(div);
        });
        listEl.style.display = 'block';
      }

      document.addEventListener('click', (e) => {
        if (!bankInput.contains(e.target) && !bankList.contains(e.target)) { bankList.style.display = 'none'; }
        if (!branchInput.contains(e.target) && !branchList.contains(e.target)) { branchList.style.display = 'none'; }
      });

      function resetBranch() {
        branchInput.value = '';
        branchInput.disabled = true;
        branchInput.placeholder = 'まず銀行を選択してください';
        branchList.innerHTML = '';
        branchList.style.display = 'none';
        branchError.style.display = 'none';
        selectedBranch = null;
        hideResult();
      }

      function showResult() {
        if (selectedBank && selectedBranch) {
          document.getElementById('res-bank-code').textContent = selectedBank.code;
          document.getElementById('res-bank-name').textContent = selectedBank.name;
          document.getElementById('res-branch-code').textContent = selectedBranch.code;
          document.getElementById('res-branch-name').textContent = selectedBranch.name;
          document.getElementById('result').style.display = 'block';
        }
      }

      function hideResult() { document.getElementById('result').style.display = 'none'; }
    });
  </script>
</body>
</html>
